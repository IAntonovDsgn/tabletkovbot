services:
  nginx:
    image: nginx:latest
    container_name: "${COMPOSE_PROJECT_NAME}-nginx"
    ports:
      - "${NGINX_HOST_PORT}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ../public:/var/www/tabletkovbot/public:ro
    depends_on:
       app:
        condition: service_started
    networks:
      - app-network

  app:
    build:
      context: ./app
    volumes:
      - ../:/var/www/tabletkovbot:rw
    container_name: "${COMPOSE_PROJECT_NAME}-app"
    environment:
      - REDIS_HOST=redis
      - DB_HOST=${MYSQL_HOST}
      - DB_PORT=3306
      - DB_USER=${MYSQL_USER}
      - DB_PASSWORD=${MYSQL_PASSWORD}
      - DB_NAME=${MYSQL_DATABASE}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network
    env_file:
      - ../.env

  outbox-relay:
    build:
      context: ./app
    volumes:
      - ../:/var/www/tabletkovbot:rw
    container_name: "${COMPOSE_PROJECT_NAME}-outbox-relay"
    environment:
      - DB_HOST=${MYSQL_HOST}
      - DB_PORT=3306
      - DB_USER=${MYSQL_USER}
      - DB_PASSWORD=${MYSQL_PASSWORD}
      - DB_NAME=${MYSQL_DATABASE}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - RABBITMQ_HOST=rabbitmq
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - app-network
    env_file:
      - ../.env
    restart: unless-stopped
    stop_grace_period: 30s
    command: ["php", "src/Presentation/Console/Console.php", "app:outbox-publish"]

  db:
    image: mariadb:10.11
    container_name: "${COMPOSE_PROJECT_NAME}-db"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "${MYSQL_PORT}:3306"
    networks:
      - app-network
    healthcheck:
      test: [ "CMD", "healthcheck.sh", "--connect", "--innodb_initialized" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: "${COMPOSE_PROJECT_NAME}-rabbitmq"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - app-network
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  db_data:
  rabbitmq_data:

networks:
  app-network:
    driver: bridge
    name: "${COMPOSE_PROJECT_NAME}-network"
